name: Verify Saudi Legal Corpus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON syntax
        run: |
          python -m json.tool api/manifest.v1.json >/dev/null
          python -m json.tool schemas/corpus-manifest-v1.schema.json >/dev/null
      - name: Enforce QADA fail-closed corpus policy
        run: python verification/check_qada_manifest.py
